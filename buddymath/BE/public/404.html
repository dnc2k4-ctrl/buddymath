<!DOCTYPE html>
<html lang="vi">
<head>

<title>404 · Không tìm thấy trang — SmartBuddy</title>
<link rel="icon" href="/images/logogiaodienmoi.jpg" type="image/jpeg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',system-ui,Arial,sans-serif;min-height:100vh;display:flex;

    background:linear-gradient(170deg,#DFF4EF 0%,#E8F4FB 45%,#F1F8FF 72%,#FFFFFF 100%);color:#12314A}
  .box{max-width:460px;text-align:center;background:#fff;border-radius:24px;padding:40px 28px;

  .emoji{font-size:64px;line-height:1}
  .code{font-size:66px;font-weight:900;color:#1FCBA6;margin:6px 0}
  h1{font-size:22px;margin-bottom:8px}
  p{color:#5A6890;font-weight:600;line-height:1.6;margin-bottom:22px}
  a.btn{display:inline-block;padding:13px 26px;border-radius:14px;text-decoration:none;font-weight:900;
    color:#fff;background:linear-gradient(135deg,#1FCBA6,#13B392);box-shadow:0 10px 22px rgba(19,179,146,.32)}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">🧭</div>
    <div class="code">404</div>
